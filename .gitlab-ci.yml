default:
  tags:
    - holi-small

stages:
  - "test"
  - "deploy"

.test:
  stage: "test"

deploy:
  stage: "deploy"
  image:
    name: "hashicorp/terraform:1.3.7"
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ["/bin/sh", "-c"]
  script:
    - apk add zip
    - cd receiveEvent/
    - zip -r ../receiveEvent.zip ./*
    - cd ../
    - cd terraform/common/
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
    - terraform init
    - terraform apply -auto-approve
  only:
    - main

stages:
  - "test"
  - "deploy"

.test:
  stage: "test"

deploy:
  stage: "deploy"
  image:
    name: "hashicorp/terraform:1.1.9"
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ["/bin/sh", "-c"]
  script:
    - cd receiveEvent/
    - zip -r ../receiveEvent.zip ./*
    - cd ../
    - cd terraform/common/
    - terraform apply -auto-approve
  only:
    - main

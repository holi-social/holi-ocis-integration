cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules
    - .yarn/

default:
  tags:
    - holi-small

stages:
  - 'install_dependencies'
  - 'test'
  - 'build'
  - 'deploy'

install_dependencies:
  stage: install_dependencies
  image:
    name: 'node:18.16.0'
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules
      - .yarn/
  script:
    - yarn install --immutable --check-cache
  only:
    changes:
      - yarn.lock

test:
  stage: 'test'
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules
      - .yarn/
    policy: pull
  image:
    name: 'node:18.16.0'
  script:
    - yarn test

build:
  stage: 'build'
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules
      - .yarn/
    policy: pull
  image:
    name: 'node:18.16.0'
  script:
    - yarn build
  artifacts:
    paths:
      - dist/

deploy:
  stage: 'deploy'
  image:
    name: 'hashicorp/terraform:1.6.1'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ['/bin/sh', '-c']
  script:
    - apk add zip
    - zip -r receiveEvent.zip dist package.json yarn.lock .yarn/ .yarnrc*
    - cd terraform/common/
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
    - terraform init
    - terraform apply -auto-approve
  only:
    - main

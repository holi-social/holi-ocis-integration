stages:
  - "test"
  - "deploy"

.test:

deploy:
  stage: "deploy"
  image:
    name: "hashicorp/terraform:1.1.9"
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ["/bin/sh", "-c"]
  script:
    - pushd receiveEvent/
    - zip -r ../receiveEvent.zip ./*
    - popd
    - pushd terraform/common/
    - terraform apply -auto-approve
  only:
    - main
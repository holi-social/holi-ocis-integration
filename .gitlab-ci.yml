default:
  tags:
    - holi-small

stages:
  - 'test'
  - 'build'
  - 'deploy'

test:
  stage: 'test'
  image:
    name: 'node:latest'
  script:
    - yarn install
    - yarn test

build:
  stage: 'build'
  image:
    name: 'node:latest'
  script:
    - yarn install
    - yarn build
  artifacts:
    paths:
      - dist/

deploy:
  stage: 'deploy'
  image:
    name: 'hashicorp/terraform:1.3.7'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ['/bin/sh', '-c']
  script:
    - apk add zip
    - zip -r receiveEvent.zip dist package.json yarn.lock
    - cd terraform/common/
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
    - terraform init
    - terraform apply -auto-approve
  only:
    - main
